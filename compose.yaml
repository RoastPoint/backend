services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: coffee_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - coffee_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coffee_shop"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: roastpoint-backend:1.0.0
    environment:
      DB_URL: jdbc:postgresql://db:5432/coffee_shop?currentSchema=coffee_shop
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_INIT_MODE: ${DB_INIT_MODE:-always}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  coffee_data:
