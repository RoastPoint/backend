server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coffee_shop?currentSchema=coffee_shop}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql,classpath:migration.sql
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.separator=^^^ END OF SCRIPT ^^^
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
